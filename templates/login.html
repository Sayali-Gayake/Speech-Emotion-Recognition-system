<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | SER Depression Detection</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e3f, #2a2a5f, #3a3a7f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
        }
        .btn {
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            background: #2962ff;
            color: white;
        }
        .btn:hover { background: #0039cb; }
        a { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Login</h2>
    <form method="POST" action="/login">
        <input type="text" name="name" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register here</a></p>
</div>
</body>
</html>
